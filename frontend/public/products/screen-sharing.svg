<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="t">
  <title id="t">Screen Sharing: a customer sharing one window with an agent, who guides them by chat</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F6FF"/>
      <stop offset="0.55" stop-color="#E6EEFF"/>
      <stop offset="1" stop-color="#EDE8FF"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0047FF"/>
      <stop offset="1" stop-color="#2300DC"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0047FF" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1080" height="600" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#0047FF" stroke-opacity="0.12">
    <path d="M0 120h1080M0 240h1080M0 360h1080M0 480h1080M180 0v600M360 0v600M540 0v600M720 0v600M900 0v600"/>
  </g>

  <!-- monitor -->
  <g filter="url(#sh)">
    <rect x="120" y="70" width="600" height="390" rx="26" fill="#0A0626"/>
  </g>
  <rect x="140" y="90" width="560" height="350" rx="14" fill="#130B3E"/>
  <rect x="380" y="460" width="80" height="40" fill="#0A0626"/>
  <rect x="320" y="496" width="200" height="16" rx="8" fill="#0A0626"/>

  <!-- a window that is not shared (dimmed) -->
  <rect x="164" y="112" width="210" height="150" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="180" y="132" width="120" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="180" y="152" width="170" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
  <rect x="180" y="168" width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="269" y="236" text-anchor="middle" font-family="Outfit, Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.45">Not shared</text>

  <!-- the shared window, outlined -->
  <rect x="300" y="190" width="380" height="232" rx="14" fill="none" stroke="#2DD4BF" stroke-width="5"/>
  <rect x="306" y="196" width="368" height="220" rx="10" fill="#FFFFFF"/>
  <rect x="306" y="196" width="368" height="38" rx="10" fill="url(#win)"/>
  <rect x="306" y="220" width="368" height="14" fill="url(#win)"/>
  <circle cx="326" cy="215" r="5" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="344" cy="215" r="5" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="366" y="209" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="326" y="256" width="200" height="14" rx="7" fill="#0A0626"/>
  <rect x="326" y="282" width="320" height="10" rx="5" fill="#C9D2EC"/>
  <rect x="326" y="300" width="280" height="10" rx="5" fill="#C9D2EC"/>
  <rect x="326" y="330" width="320" height="56" rx="10" fill="#FFF1F1" stroke="#F5C7C7" stroke-width="2"/>
  <circle cx="352" cy="358" r="11" fill="#C81E1E"/>
  <rect x="350" y="351" width="4" height="9" rx="2" fill="#FFFFFF"/>
  <circle cx="352" cy="364" r="2" fill="#FFFFFF"/>
  <rect x="374" y="346" width="190" height="10" rx="5" fill="#C81E1E" fill-opacity="0.7"/>
  <rect x="374" y="362" width="140" height="8" rx="4" fill="#C81E1E" fill-opacity="0.4"/>

  <!-- sharing indicator -->
  <rect x="420" y="102" width="268" height="38" rx="19" fill="#2DD4BF"/>
  <circle cx="442" cy="121" r="7" fill="#0A0626"/>
  <text x="458" y="126" font-family="Outfit, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0626">Sharing 1 window</text>
  <rect x="600" y="108" width="80" height="26" rx="13" fill="#0A0626"/>
  <text x="640" y="126" text-anchor="middle" font-family="Outfit, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Stop</text>

  <!-- agent chat -->
  <g filter="url(#sh)">
    <rect x="760" y="120" width="230" height="340" rx="24" fill="#FFFFFF"/>
  </g>
  <circle cx="800" cy="164" r="22" fill="#00B8FF"/>
  <path d="M790 166a10 10 0 0 1 20 0v6h-5v-6a5 5 0 0 0-10 0v6h-5z" fill="#0A0626"/>
  <text x="832" y="160" font-family="Outfit, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0626">Cube agent</text>
  <text x="832" y="178" font-family="Outfit, Inter, Arial, sans-serif" font-size="12" fill="#6B6E75">watching your window</text>
  <rect x="780" y="206" width="190" height="70" rx="16" fill="#F0F4FB"/>
  <text x="796" y="234" font-family="Outfit, Inter, Arial, sans-serif" font-size="13" fill="#404348">I can see the error.</text>
  <text x="796" y="254" font-family="Outfit, Inter, Arial, sans-serif" font-size="13" fill="#404348">Let's fix it together.</text>
  <rect x="808" y="292" width="162" height="50" rx="16" fill="#0047FF"/>
  <text x="822" y="322" font-family="Outfit, Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">Great, thank you!</text>
  <rect x="780" y="390" width="190" height="44" rx="14" fill="#F5F8FD" stroke="#DCE2EE" stroke-width="2"/>
  <rect x="796" y="408" width="110" height="8" rx="4" fill="#C9D2EC"/>
  <circle cx="948" cy="412" r="12" fill="#0047FF"/>
  <path d="M943 412l9-5v10z" fill="#FFFFFF"/>
</svg>
